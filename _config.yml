title: SeulGi Jeong
tagline: Backend · DevOps · Smart Contract Developer
description: >-
  정슬기(SeulGi Jeong) — 백엔드/DevOps/스마트컨트랙트 개발자의 포트폴리오와 블로그.
author: SeulGi Jeong
email: sllki1@naver.com
url: "https://enitsed.github.io"
baseurl: ""
lang: ko

# 소셜 공유 기본 이미지 (페이지 프론트매터의 image: 로 개별 재정의 가능)
og_image: /assets/img/og-default.png
og_image_width: 1200
og_image_height: 630

# 페이지네이션 (blog/index.html 대상)
paginate: 12
paginate_path: "/blog/page:num/"

# 글 URL
permalink: /blog/:title/

# 빌드
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

sass:
  style: compressed
  sass_dir: assets/css

plugins:
  - jekyll-paginate
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE.txt
  - docs
  - .superpowers
  - vendor
